name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, intl, mbstring, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: php artisan test

      - name: Check formatting
        run: vendor/bin/pint --test

  frontend:
    name: Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # See docker/prod/Dockerfile — rollup's per-platform binary is an optional
      # dependency that `npm ci` will not resolve across architectures.
      - run: npm install --no-audit --no-fund
      - run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The production image is what actually ships, so a broken Dockerfile
      # should fail here rather than at deploy time.
      - run: docker build -f docker/prod/Dockerfile .
