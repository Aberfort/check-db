name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, intl, mbstring, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: php artisan test

      - name: Check formatting
        run: vendor/bin/pint --test

  image:
    name: Production image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Builds the frontend too, so a broken asset build fails here rather than
      # at deploy time — which is why there is no separate frontend job.
      - run: docker build -f docker/prod/Dockerfile .
